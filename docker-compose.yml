services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cekgarasi-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=cekgarasi
      - DB_PASSWORD=cekgarasipassword
      - DB_NAME=cekgarasi
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: cekgarasi-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cekgarasi
      MYSQL_USER: cekgarasi
      MYSQL_PASSWORD: cekgarasipassword
    ports:
      - "3306:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "cekgarasi", "-pcekgarasipassword"]
      timeout: 10s
      retries: 10
      interval: 5s

volumes:
  mysql_data:
