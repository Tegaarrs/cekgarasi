<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CekGarasi — Katalog & Panduan Harga Mobil Bekas</title>
  <meta name="description"
    content="Temukan mobil bekas berkualitas dengan panduan harga pasar yang wajar, perbandingan spesifikasi lengkap, dan simulasi cicilan transparan." />
  <!-- Theme Init Script (anti-flicker) -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('cekgarasi_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
  <!-- Google Fonts: Plus Jakarta Sans & Inter fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Preload Hero Background Image (Main Variant) -->
  <link rel="preload" as="image" type="image/avif" imagesrcset="/images/hero/hero-640.avif 640w, /images/hero/hero-720.avif 720w" imagesizes="100vw" fetchpriority="high" />
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/images/logo.png" />
  <link rel="apple-touch-icon" href="/images/logo.png" />

  <style>
    #cg-preloader {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      font-family: 'Inter', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      transition: opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.28s ease;
    }

    #cg-preloader.cg-preloader-hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .cg-stage {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.14em;
      font-size: clamp(36px, 5.2vw, 60px);
      font-weight: 700;
      letter-spacing: -0.045em;
      line-height: 1;
      color: #FFFFFF;
    }

    /* Wordmark "CekGarasi" with vertical mask reveal like "layer" */
    .cg-word-mask {
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      padding: 0.08em 0.02em;
      mask-image: linear-gradient(to bottom, transparent 0%, #000 16%, #000 84%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 16%, #000 84%, transparent 100%);
    }

    .cg-word-text {
      display: inline-block;
      transform: translateY(0%);
      animation: cgWordReveal 0.45s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }

    @keyframes cgWordReveal {
      0% {
        transform: translateY(65%);
        opacity: 0;
      }
      100% {
        transform: translateY(0%);
        opacity: 1;
      }
    }

    /* Odometer-style Vertical Rolling Slot for Car Logos */
    .cg-slot-window {
      position: relative;
      height: 1.15em;
      width: 1.22em;
      overflow: hidden;
      display: inline-flex;
      align-items: flex-start;
      justify-content: center;
      mask-image: linear-gradient(to bottom, transparent 0%, #000 22%, #000 78%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 22%, #000 78%, transparent 100%);
    }

    .cg-slot-track {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      will-change: transform;
      /* Rolls through 6 car icons and locks onto the final icon over 1.25s within the 1.5s screen duration */
      animation: cgCarRoll 1.28s cubic-bezier(0.15, 0.85, 0.25, 1) forwards;
    }

    .cg-slot-item {
      height: 1.15em;
      width: 1.22em;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cg-car-svg {
      width: 0.96em;
      height: 0.96em;
      display: block;
      color: #FFFFFF;
    }

    @keyframes cgCarRoll {
      0% {
        transform: translateY(0%);
      }
      20% {
        transform: translateY(-16.6667%);
      }
      42% {
        transform: translateY(-33.3333%);
      }
      64% {
        transform: translateY(-50.0%);
      }
      82% {
        transform: translateY(-66.6667%);
      }
      100% {
        transform: translateY(-83.3333%);
      }
    }
  </style>
</head>

<body class="bg-[#F6F8FB] dark:bg-[#0B0F19] text-[#0F172A] dark:text-[#E5E7EB] transition-colors duration-200">
  <!-- Minimalist Black Loading Screen ("CekGarasi" + Rolling Car Logo, 1.5s duration) -->
  <div id="cg-preloader" role="status" aria-label="Memuat CekGarasi">
    <div class="cg-stage">
      <div class="cg-word-mask">
        <span class="cg-word-text">CekGarasi</span>
      </div>
      <div class="cg-slot-window" aria-hidden="true">
        <div class="cg-slot-track">
          <!-- Item 1: Sports Coupe Profile -->
          <div class="cg-slot-item">
            <svg class="cg-car-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" />
              <circle cx="7" cy="17" r="2" />
              <path d="M9 17h6" />
              <circle cx="17" cy="17" r="2" />
            </svg>
          </div>
          <!-- Item 2: Front Showroom Car Emblem -->
          <div class="cg-slot-item">
            <svg class="cg-car-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11" />
              <rect x="3" y="11" width="18" height="6" rx="2" />
              <path d="M5 17v2" />
              <path d="M19 17v2" />
              <circle cx="7.5" cy="14" r="1" fill="currentColor" />
              <circle cx="16.5" cy="14" r="1" fill="currentColor" />
            </svg>
          </div>
          <!-- Item 3: SUV / MPV Silhouette -->
          <div class="cg-slot-item">
            <svg class="cg-car-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 16v-4l2-5h11l3 4 2 1v4h-2" />
              <path d="M5 16H3" />
              <path d="M9 16h6" />
              <circle cx="7" cy="16" r="2" />
              <circle cx="17" cy="16" r="2" />
            </svg>
          </div>
          <!-- Item 4: Executive Sedan Front -->
          <div class="cg-slot-item">
            <svg class="cg-car-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 16H9m10 0h3v-3.15a1 1 0 0 0-.84-.99L16 11l-2.7-3.6a1 1 0 0 0-.8-.4H5.24a2 2 0 0 0-1.8 1.1l-.8 1.63A6 6 0 0 0 2 12.42V16h2" />
              <circle cx="6.5" cy="16.5" r="2.5" />
              <circle cx="16.5" cy="16.5" r="2.5" />
            </svg>
          </div>
          <!-- Item 5: Dynamic Fast Car -->
          <div class="cg-slot-item">
            <svg class="cg-car-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11" />
              <rect x="3" y="11" width="18" height="6" rx="2" />
              <path d="M5 17v2" />
              <path d="M19 17v2" />
              <path d="M10 14h4" />
            </svg>
          </div>
          <!-- Item 6 (Final Locked Position): Signature Car Logo -->
          <div class="cg-slot-item">
            <svg class="cg-car-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" />
              <circle cx="7" cy="17" r="2" />
              <path d="M9 17h6" />
              <circle cx="17" cy="17" r="2" />
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="root"></div>

  <script>
    (function () {
      var preloader = document.getElementById('cg-preloader');
      if (!preloader) return;
      // Durasi loading screen tepat 1,5 detik (1500ms)
      setTimeout(function () {
        preloader.classList.add('cg-preloader-hide');
        setTimeout(function () {
          if (preloader && preloader.parentNode) {
            preloader.parentNode.removeChild(preloader);
          }
        }, 300);
      }, 1500);
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
